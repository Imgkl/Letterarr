<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Letterboxd to *arr Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div>
          <p class="eyebrow">Letterboxd → Jellyseerr</p>
          <h1>Send films in one click.</h1>
          <p class="lede">Adds the current Letterboxd film to Jellyseerr.</p>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <div>
            <p class="eyebrow">Connection</p>
            <h2>Jellyseerr</h2>
            <p class="muted">Set your Jellyseerr URL and API key.</p>
          </div>
        </div>
        <div class="field">
          <label>LAN Base URL</label>
          <input id="jelly-lan" placeholder="http://192.168.1.10:5055" />
        </div>
        <div class="field">
          <label>API Key</label>
          <input id="jelly-key" placeholder="Paste your Jellyseerr API key" />
        </div>
        <div class="actions inline">
          <button id="save">Save</button>
          <button id="test-connection" class="ghost">Test connection</button>
          <span id="test-status" class="muted"></span>
        </div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
